<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="Resume page for Sam Edelstein, Data & AI executive for CDO, VP Data & AI, AI enablement, data platform strategy, and executive AI transformation roles."
    />
    <link rel="canonical" href="https://samedelstein.com/resume/" />
    <meta property="og:title" content="Sam Edelstein | Resume" />
    <meta
      property="og:description"
      content="Download Sam Edelstein's resume or view the recruiter packet for executive Data & AI searches."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://samedelstein.com/resume/" />
    <meta property="og:image" content="https://samedelstein.com/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam Edelstein | Resume" />
    <meta
      name="twitter:description"
      content="Resume and recruiter packet for executive Data & AI leadership roles."
    />
    <meta name="twitter:image" content="https://samedelstein.com/social-card.png" />
    <title>Sam Edelstein | Resume</title>
    <style>
      :root {
        --ink: #020617;
        --muted: #475569;
        --line: #dbe3ef;
        --blue: #1d4ed8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.55;
      }

      main {
        width: calc(100% - 40px);
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 56px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 19px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 16px;
        color: inherit;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .button.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #ffffff;
      }

      @media (max-width: 680px) {
        main {
          width: calc(100vw - 48px);
          max-width: 320px;
          margin-left: 24px;
          margin-right: auto;
          padding: 48px 0;
        }

        h1 {
          font-size: 40px;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Resume</p>
      <h1>Sam Edelstein resume and recruiter materials.</h1>
      <p>
        Download the current PDF resume, use the ATS-friendly text resume, or open the recruiter packet for a fast summary of target roles, proof points, and contact details.
      </p>
      <div class="actions">
        <a class="button primary" href="/sam-edelstein-resume.pdf">Download Resume</a>
        <a class="button" href="/sam-edelstein-resume.txt">ATS Text Resume</a>
        <a class="button" href="/recruiter/">Recruiter Packet</a>
        <a class="button" href="/">Current Site</a>
      </div>
    </main>
  </body>
</html>
