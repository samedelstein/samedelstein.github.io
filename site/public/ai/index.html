<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Sam Edelstein" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="robots" content="noindex,follow,noarchive" />
    <meta http-equiv="refresh" content="3; url=/" />
    <meta
      name="description"
      content="Sam Edelstein works on enterprise data and AI, governed data foundations, useful AI workflows, practical tools, and public data background."
    />
    <link rel="canonical" href="https://samedelstein.com/" />
    <link rel="alternate" type="application/json" href="https://samedelstein.com/profile.json" />
    <link rel="alternate" type="text/vcard" href="https://samedelstein.com/sam-edelstein.vcf" />
    <meta property="og:title" content="Sam Edelstein | Enterprise Data and AI" />
    <meta
      property="og:description"
      content="Enterprise data and AI work, governed data foundations, useful AI workflows, practical tools, and public data background."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samedelstein.com/" />
    <meta property="og:image" content="https://samedelstein.com/social-card.png" />
    <meta property="og:image:alt" content="Sam Edelstein personal site preview for enterprise data and AI work." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam Edelstein | Enterprise Data and AI" />
    <meta name="twitter:description" content="Enterprise data and AI work, governed data foundations, useful AI workflows, practical tools, and public data background." />
    <meta name="twitter:image" content="https://samedelstein.com/social-card.png" />
    <meta name="twitter:image:alt" content="Sam Edelstein personal site preview for enterprise data and AI work." />
    <title>Sam Edelstein | Enterprise Data and AI</title>
    <style>
      :root {
        --ink: #020617;
        --muted: #475569;
        --line: #dbe3ef;
        --blue: #1d4ed8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
      }

      main {
        width: calc(100% - 40px);
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 56px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 19px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 16px;
        color: inherit;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .button.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #ffffff;
      }

      @media (max-width: 680px) {
        main {
          width: calc(100vw - 48px);
          max-width: 320px;
          margin-left: 24px;
          margin-right: auto;
          padding: 48px 0;
        }

        h1 {
          font-size: 40px;
        }

        .button {
          width: 100%;
        }
      }

      :root {
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        font-family: var(--font-sans);
      }

      h1,
      h2,
      h3 {
        font-weight: 300;
      }</style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AI</p>
      <h1>This page moved to the main site.</h1>
      <p>
        The current site has enterprise data and AI work, current focus, selected projects, tools and vocabulary, writing, background, and contact details.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Current Site</a>
        <a class="button" href="/">Home</a>
        <a class="button" href="/proof/">Selected Work</a>
        <a class="button" href="/writing/">Writing</a>
        <a class="button" href="/writing/">Writing</a>
        <a class="button" href="/contact/">Contact</a>
      </div>
    </main>
  </body>
</html>
