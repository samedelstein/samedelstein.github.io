<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sam Edelstein - Enterprise Data and AI</title>
  <desc id="desc">Social preview card for Sam Edelstein's personal website.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="48" y="48" width="1104" height="534" fill="#f8fafc" stroke="#dbe3ef" stroke-width="2"/>
